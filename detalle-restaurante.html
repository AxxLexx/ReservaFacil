<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserva Fácil | Restaurante</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/detalle-restaurante.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <button id="volver">

        <i class="fa-solid fa-arrow-left"></i>

    </button>

    <h2>Detalle del Restaurante</h2>

</header>

<main>

    <img
        src="assets/img/restaurante.jpeg"
        id="imagenRestaurante"
        class="imagenPrincipal"
        alt="Restaurante">

    <section class="informacion">

        <h1 id="nombreRestaurante"></h1>

        <p class="calificacion">

            ⭐⭐⭐⭐⭐ 4.8

        </p>

        <div class="datos">

            <p>

                🍽 <strong>Tipo:</strong>

                <span id="tipoComida">

                    Italiana

                </span>

            </p>

            <p>

                📍 <strong>Ubicación:</strong>

                Monterrey, Nuevo León

            </p>

            <p>

                🕒 <strong>Horario:</strong>

                1:00 PM - 11:00 PM

            </p>

        </div>

        <h3>

            Descripción

        </h3>

        <p id="descripcion">

            Restaurante familiar con platillos preparados al momento y ambiente acogedor.

        </p>

        <button id="reservar">

            Reservar mesa

        </button>

    </section>

</main>

<script src="js/storage.js"></script>
<script src="js/detalle-restaurante.js"></script>

</body>

</html>
