<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Fácil | Registro</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="container">

        <div class="left">

            <img src="assets/img/restaurante.jpeg" alt="Restaurante">

        </div>

        <div class="right">

            <div class="login-box">

                <h1>Crear cuenta</h1>

                <p class="subtitle">
                    Completa los datos para registrarte
                </p>

                <form id="formRegistro">

                    <div class="input-group">

                        <label>Nombre completo</label>

                        <input
                            id="nombre"
                            type="text"
                            placeholder="Juan Pérez"
                            required>

                    </div>

                    <div class="input-group">

                        <label>Correo electrónico</label>

                        <input
                            id="correo"
                            type="email"
                            placeholder="correo@ejemplo.com"
                            required>

                    </div>

                    <div class="input-group">

                        <label>Contraseña</label>

                        <input
                            id="password"
                            type="password"
                            placeholder="********"
                            required>

                    </div>

                    <button type="submit">

                        Registrarse

                    </button>

                </form>

                <p class="link">

                    ¿Ya tienes cuenta?

                    <a href="index.html">

                        Inicia sesión

                    </a>

                </p>

            </div>

        </div>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/registro.js"></script>

</body>

</html>
