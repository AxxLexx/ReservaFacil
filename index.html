<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Fácil | Iniciar sesión</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="container">

        <!-- Imagen -->
        <div class="left">

            <img src="assets/img/restaurante.jpeg" alt="Restaurante">

        </div>

        <!-- Formulario -->
        <div class="right">

            <div class="login-box">

                <h1>Reserva Fácil</h1>

                <p class="subtitle">
                    Inicia sesión para continuar
                </p>

                <form id="formLogin">

                    <div class="input-group">

                        <label>Correo electrónico</label>

                        <input
                            id="correo"
                            type="email"
                            placeholder="ejemplo@correo.com"
                            required>

                    </div>

                    <div class="input-group">

                        <label>Contraseña</label>

                        <input
                            id="password"
                            type="password"
                            placeholder="********"
                            required>

                    </div>

                    <button type="submit">

                        Iniciar sesión

                    </button>

                </form>

                <p class="link">

                    ¿No tienes cuenta?

                    <a href="registro.html">

                        Regístrate aquí

                    </a>

                </p>

            </div>

        </div>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/login.js"></script> 

</body>

</html>
