<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserva Fácil | Confirmación</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/confirmacion.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <main class="contenedor">

        <div class="check">

            <i class="fa-solid fa-circle-check"></i>

        </div>

        <h1>

            ¡Reserva confirmada!

        </h1>

        <p>

            Tu reservación se registró correctamente.

        </p>

        <div class="detalle">

            <div class="fila">

                <span>Restaurante</span>

                <strong id="restaurante"></strong>

            </div>

            <div class="fila">

                <span>Mesa</span>

                <strong id="mesa"></strong>

            </div>

            <div class="fila">

                <span>Fecha</span>

                <strong id="fecha"></strong>

            </div>

            <div class="fila">

                <span>Hora</span>

                <strong id="hora"></strong>

            </div>

        </div>

        <button id="volverInicio">

            Volver al inicio

        </button>

    </main>

    <script src="js/storage.js"></script>
    <script src="js/confirmacion.js"></script>

</body>

</html>
