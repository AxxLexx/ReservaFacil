<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserva Fácil | Reservar Mesa</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/mesa.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <button id="volver">

        <i class="fa-solid fa-arrow-left"></i>

    </button>

    <div>

        <h2 id="nombreRestaurante"></h2>

        <p>Completa los datos de tu reserva</p>

    </div>

</header>

<main>

    <img
        src="assets/img/restaurante.jpeg"
        class="imagen-restaurante"
        alt="Restaurante">

    <section class="datosReserva">

        <div class="campo">

            <label>📅 Fecha</label>

            <input
                type="date"
                id="fecha">

        </div>

        <div class="campo">

            <label>🕒 Hora</label>

            <select id="hora">

                <option value="">Selecciona una hora</option>

                <option>6:00 PM</option>
                <option>6:30 PM</option>
                <option>7:00 PM</option>
                <option>7:30 PM</option>
                <option>8:00 PM</option>
                <option>8:30 PM</option>
                <option>9:00 PM</option>

            </select>

        </div>

        <div class="campo">

            <label>👥 Personas</label>

            <select id="personas">

                <option value="">Selecciona</option>

                <option value="1">1 Persona</option>
                <option value="2">2 Personas</option>
                <option value="3">3 Personas</option>
                <option value="4">4 Personas</option>
                <option value="5">5 Personas</option>
                <option value="6">6 Personas</option>
                <option value="7">7 Personas</option>
                <option value="8">8 Personas</option>

            </select>

        </div>

    </section>

    <h3 class="tituloMesas">

        Selecciona una mesa

    </h3>

    <div id="contenedorMesas" class="contenedorMesas">

    </div>

    <button
        id="confirmar"
        disabled>

        Confirmar reserva

    </button>

</main>

<script src="js/storage.js"></script>
<script src="js/mesa.js"></script>

</body>

</html>
